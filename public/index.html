<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Collection</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            color: #333;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        h2 {
            margin-top: 20px;
            margin-bottom: 10px;
        }
        .form-container {
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
        }
        input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        input[type="text"] { width: 200px; }
        input[type="number"] { width: 100px; }
        button {
            padding: 8px 15px;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #e0e0e0;
        }
        #message {
            color: #333;
            margin-bottom: 20px;
            font-size: 14px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #f9f9f9;
            font-weight: bold;
        }
        .load-btn {
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>Movie Collection</h1>

    <h2>Add Movie</h2>
    <div class="form-container">
        <input type="text" id="title" placeholder="Inception">
        <input type="text" id="genre" placeholder="Science Fiction">
        <input type="number" id="year" placeholder="2010">
        <button onclick="addMovie()">Add Movie</button>
    </div>
    <div id="message"></div>

    <h2>Movies</h2>
    <button class="load-btn" onclick="loadMovies()">Load Movies</button>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Genre</th>
                <th>Year</th>
            </tr>
        </thead>
        <tbody id="movieTableBody">
        </tbody>
    </table>

    <script>
        const API_URL = '/api/movies';
        const messageDiv = document.getElementById('message');
        const tableBody = document.getElementById('movieTableBody');

        async function loadMovies() {
            try {
                const response = await fetch(API_URL);
                const movies = await response.json();

                tableBody.innerHTML = '';

                movies.forEach(movie => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${movie.id}</td>
                        <td>${movie.title}</td>
                        <td>${movie.genre}</td>
                        <td>${movie.year}</td>
                    `;
                    tableBody.appendChild(row);
                });
            } catch (error) {
                console.error('Error loading movies:', error);
                messageDiv.textContent = 'Error loading movies.';
            }
        }

        async function addMovie() {
            const title = document.getElementById('title').value;
            const genre = document.getElementById('genre').value;
            const year = document.getElementById('year').value;

            if (!title || !genre || !year) {
                messageDiv.textContent = 'Please fill in all fields.';
                messageDiv.style.color = 'red';
                return;
            }

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ title, genre, year })
                });

                const data = await response.json();

                if (response.ok) {
                    messageDiv.textContent = data.message;
                    messageDiv.style.color = 'black';
                    
                    document.getElementById('title').value = '';
                    document.getElementById('genre').value = '';
                    document.getElementById('year').value = '';

                    loadMovies();
                } else {
                    messageDiv.textContent = data.error;
                    messageDiv.style.color = 'red';
                }
            } catch (error) {
                console.error('Error adding movie:', error);
                messageDiv.textContent = 'Error adding movie.';
                messageDiv.style.color = 'red';
            }
        }
    </script>
</body>
</html>
